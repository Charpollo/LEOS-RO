<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/engineering-panel.css">
    <!-- Netlify Identity for Authentication -->

    <!-- Webpack will inject the correct script tags automatically -->
    <style>
      /* Aurora background animation */
      .aurora-background {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(45deg, 
          rgba(255,0,0,0.1) 0%, 
          rgba(255,100,0,0.05) 25%, 
          rgba(0,0,0,0.8) 50%, 
          rgba(255,0,100,0.05) 75%, 
          rgba(255,0,0,0.1) 100%);
        animation: aurora 15s ease-in-out infinite;
      }
      
      @keyframes aurora {
        0%, 100% { 
          background: linear-gradient(45deg, 
            rgba(255,0,0,0.2) 0%, 
            rgba(255,100,0,0.1) 25%, 
            rgba(0,0,0,0.9) 50%, 
            rgba(255,0,100,0.1) 75%, 
            rgba(255,0,0,0.2) 100%);
          transform: rotate(0deg) scale(1);
        }
        25% { 
          background: linear-gradient(90deg, 
            rgba(255,50,0,0.15) 0%, 
            rgba(255,0,50,0.1) 33%, 
            rgba(0,0,0,0.85) 66%, 
            rgba(255,100,0,0.15) 100%);
          transform: rotate(5deg) scale(1.1);
        }
        50% { 
          background: linear-gradient(135deg, 
            rgba(255,0,50,0.2) 0%, 
            rgba(255,100,0,0.05) 25%, 
            rgba(0,0,0,0.9) 50%, 
            rgba(255,50,0,0.1) 75%, 
            rgba(255,0,0,0.15) 100%);
          transform: rotate(-5deg) scale(1.05);
        }
        75% { 
          background: linear-gradient(180deg, 
            rgba(255,100,0,0.1) 0%, 
            rgba(255,0,0,0.2) 33%, 
            rgba(0,0,0,0.88) 66%, 
            rgba(255,0,100,0.1) 100%);
          transform: rotate(3deg) scale(1.02);
        }
      }
      
      /* Loading progress animation */
      @keyframes loading {
        0% { width: 0%; }
        50% { width: 70%; }
        100% { width: 100%; }
      }
      
      /* Help modal side panel */
      /* Pulsing glow for help sphere */
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(0,204,255,0.7); }
        70% { box-shadow: 0 0 0 12px rgba(0,204,255,0); }
        100% { box-shadow: 0 0 0 0 rgba(0,204,255,0); }
      }
      #help-sphere-btn {
        pointer-events: auto;
        animation: pulse 3s ease-in-out infinite;
        color: #fff;
        font-size: 1.2em;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #help-sphere-btn:hover {
        background: rgba(102,217,255,0.9);
      }
      
      /* Apply pulse animation to simulation settings button */
      #simulation-settings-btn {
        animation: pulse 3s ease-in-out infinite;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
      }

    </style>
</head>
<body>
    <script>
        // Immediate auth check before anything renders
        // Check for passphrase auth first
        const hasPassphraseSession = localStorage.getItem('redorbit_auth_session');
        
        if (!hasPassphraseSession && window.location.hostname !== 'localhost') {
            // Use passphrase login
            window.location.href = '/login.html';

    </script>
    <!-- Particle Canvas for Loading -->
    <canvas id="particle-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: black;"></canvas>
    
    <div id="renderCanvas-container">
        <!-- UNCLASSIFIED Banner -->
        <div id="unclass-banner" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 30px; background: linear-gradient(135deg, #228B22 0%, #32CD32 100%); color: #000000; font-family: 'Orbitron', monospace; font-weight: bold; font-size: 14px; text-align: center; line-height: 30px; letter-spacing: 3px; z-index: 20000; box-shadow: 0 2px 10px rgba(34, 139, 34, 0.5); border-bottom: 2px solid #000000;">
            UNCLASSIFIED
        </div>
        
        <!-- Control Dock Removed -->
        
        <!-- CyberRTS Logo removed - now in header -->
        
        <!-- Floating Time Display -->
        <div id="time-display" class="floating-display" style="position:absolute; top:24px; left:50%; transform:translateX(-50%); z-index:3000; min-width:220px; text-align:center;">

            </div>
            <div id="time-controls" class="time-controls-panel hidden" style="margin-top:8px;">
                <button class="time-btn speed-btn" data-mult="0.25">0.25x</button>
                <button class="time-btn speed-btn" data-mult="0.5">0.5x</button>
                <button class="time-btn speed-btn" data-mult="1">1x</button>
                <button class="time-btn speed-btn" data-mult="2">2x</button>
                <button class="time-btn speed-btn" data-mult="4">4x</button>
            </div>
        </div>
        
        <!-- Speed Mode Toggle -->
        <div id="speed-mode-toggle" style="position:absolute; top:70px; left:50%; transform:translateX(-50%); z-index:3000; display:flex; gap:5px; background:rgba(0,0,0,0.8); padding:5px; border-radius:6px; border:1px solid rgba(255,0,0,0.3);">
            <button id="realtime-mode" style="background:rgba(255,0,0,0.8); color:#ffffff; border:1px solid rgba(255,0,0,0.8); padding:6px 12px; border-radius:4px; cursor:pointer; font-size:11px; font-family:'Orbitron',monospace; font-weight:600;">REAL TIME</button>
            <button id="fast-mode" style="background:rgba(255,0,0,0.2); color:#ff0000; border:1px solid rgba(255,0,0,0.4); padding:6px 12px; border-radius:4px; cursor:pointer; font-size:11px; font-family:'Orbitron',monospace; font-weight:600;">60X SPEED</button>
        </div>
        
        <!-- Loading Screen -->
        <div id="loading-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; overflow: hidden;">
            <!-- Particle Canvas -->
            <canvas id="loading-particles" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;"></canvas>
            <div style="text-align: center; position: relative; z-index: 2;">
                <h1 style="color: #ff0000; font-family: 'Orbitron', monospace; font-size: 48px; letter-spacing: 4px; text-shadow: 0 0 20px rgba(255, 0, 0, 0.5);">RED ORBIT</h1>
            </div>
        </div>
        
        <!-- Loading Particle Animation Script -->
        <script>
            (function() {
                const canvas = document.getElementById('loading-particles');
                if (!canvas) return;
                
                const ctx = canvas.getContext('2d');
                
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                
                const particles = [];
                const particleCount = 100;
                
                class Particle {
                    constructor() {
                        this.x = Math.random() * canvas.width;
                        this.y = Math.random() * canvas.height;
                        this.size = Math.random() * 2;
                        this.speedX = (Math.random() - 0.5) * 0.5;
                        this.speedY = (Math.random() - 0.5) * 0.5;
                        this.opacity = Math.random() * 0.5 + 0.2;
                    }
                    
                    update() {
                        this.x += this.speedX;
                        this.y += this.speedY;
                        
                        if (this.x > canvas.width || this.x < 0) this.speedX *= -1;
                        if (this.y > canvas.height || this.y < 0) this.speedY *= -1;
                    }
                    
                    draw() {
                        ctx.fillStyle = `rgba(255, 0, 0, ${this.opacity})`;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                
                // Create particles
                for (let i = 0; i < particleCount; i++) {
                    particles.push(new Particle());
                }
                
                // Animation loop
                function animate() {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    particles.forEach(particle => {
                        particle.update();
                        particle.draw();
                    });
                    
                    // Draw connections
                    particles.forEach((p1, index) => {
                        particles.slice(index + 1).forEach(p2 => {
                            const distance = Math.hypot(p1.x - p2.x, p1.y - p2.y);
                            if (distance < 100) {
                                ctx.strokeStyle = `rgba(255, 0, 0, ${0.1 * (1 - distance / 100)})`;
                                ctx.lineWidth = 0.5;
                                ctx.beginPath();
                                ctx.moveTo(p1.x, p1.y);
                                ctx.lineTo(p2.x, p2.y);
                                ctx.stroke();
                            }
                        });
                    });
                    
                    if (document.getElementById('loading-screen').style.display !== 'none') {
                        requestAnimationFrame(animate);
                    }
                }
                
                animate();
                
                // Handle resize
                window.addEventListener('resize', () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                });
            })();
        </script>
        
        <!-- Floating UI Elements (no black banner) -->
        <div id="red-orbit-ui" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100;">
            <!-- Logo and RED ORBIT text (top left - floating) -->
            <div id="logo-container" style="position: fixed; top: 20px; left: 20px; display: flex; align-items: center; gap: 15px; pointer-events: auto; z-index: 1000;">
                <img src="assets/CyberRTS-Simple-Logo.svg" alt="CyberRTS" style="height: 35px; opacity: 0.9;">
                <h1 style="color: #ff0000; font-size: 18px; font-weight: bold; margin: 0; font-family: 'Orbitron', monospace; letter-spacing: 3px; text-shadow: 0 2px 10px rgba(255,0,0,0.5);">RED ORBIT</h1>
            </div>
            
            <!-- Object count and LIVE status (top right - floating, no boxes) -->
            <div id="status-container" style="position: fixed; top: 20px; right: 20px; display: flex; align-items: center; gap: 25px; pointer-events: auto; z-index: 1000;">
                <div style="display: flex; align-items: center;">
                    <span style="color: rgba(255,255,255,0.6); font-size: 11px; text-transform: uppercase; margin-right: 8px; text-shadow: 0 2px 10px rgba(0,0,0,0.8);">OBJECTS:</span>
                    <span id="objects-tracked-count" style="color: #ff0000; font-size: 16px; font-weight: bold; font-family: 'Orbitron', monospace; text-shadow: 0 2px 10px rgba(255,0,0,0.5);">15000</span>
                </div>
                <div style="display: flex; align-items: center;">
                    <span id="live-indicator" style="display: inline-block; width: 8px; height: 8px; background: #ff0000; border-radius: 50%; margin-right: 8px; animation: pulse 2s infinite; box-shadow: 0 0 10px rgba(255,0,0,0.5);"></span>
                    <span style="color: #ff0000; font-size: 12px; font-family: 'Orbitron', monospace; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 2px 10px rgba(255,0,0,0.5);">LIVE</span>
                </div>
            </div>
            <!-- Orbital Legend Removed -->
        </div>
        
        
    </div>
    
    <canvas id="renderCanvas" touch-action="none" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;"></canvas>
    
    <script>
        // User profile dropdown functions
        window.toggleUserProfile = function(event) {
            event.stopPropagation();
            const dropdown = document.getElementById('user-profile-dropdown');
            if (dropdown) {
                dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
            }
        };
        
        window.logoutUser = function() {
            if (confirm('Are you sure you want to logout?')) {
                window.location.reload();
            }
        };
        
        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('user-profile-dropdown');
            const userProfile = document.querySelector('.user-profile');
            if (dropdown && !userProfile.contains(event.target)) {
                dropdown.style.display = 'none';
            }
        });
        
        // L key handler removed - orbital legend no longer exists
        
        // Speed mode toggle handlers
        document.addEventListener('DOMContentLoaded', function() {
            const realtimeBtn = document.getElementById('realtime-mode');
            const fastBtn = document.getElementById('fast-mode');
            
            if (realtimeBtn && fastBtn) {
                // Real-time mode (1x speed)
                realtimeBtn.addEventListener('click', function() {
                    // Update visual state
                    realtimeBtn.style.background = 'rgba(255,0,0,0.8)';
                    realtimeBtn.style.color = '#ffffff';
                    fastBtn.style.background = 'rgba(255,0,0,0.2)';
                    fastBtn.style.color = '#ff0000';
                    
                    // Set simulation speed to 1x
                    if (window.simState) {
                        window.simState.timeMultiplier = 1;
                        window.simState.lastTimeMultiplier = 1;
                    }
                    
                    // Update physics engine
                    if (window.redOrbitPhysics) {
                        window.redOrbitPhysics.physicsTimeMultiplier = 1;
                    }
                    
                    // Show notification
                    if (window.showNotification) {
                        window.showNotification('REAL-TIME MODE ACTIVATED', 'info');
                    }
                });
                
                // 60x speed mode
                fastBtn.addEventListener('click', function() {
                    // Update visual state
                    fastBtn.style.background = 'rgba(255,0,0,0.8)';
                    fastBtn.style.color = '#ffffff';
                    realtimeBtn.style.background = 'rgba(255,0,0,0.2)';
                    realtimeBtn.style.color = '#ff0000';
                    
                    // Set simulation speed to 60x
                    if (window.simState) {
                        window.simState.timeMultiplier = 60;
                        window.simState.lastTimeMultiplier = 60;
                    }
                    
                    // Update physics engine
                    if (window.redOrbitPhysics) {
                        window.redOrbitPhysics.physicsTimeMultiplier = 60;
                    }
                    
                    // Show notification
                    if (window.showNotification) {
                        window.showNotification('60X SPEED MODE ACTIVATED', 'info');
                    }
                });
                
                // Add keyboard shortcuts
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'r' || e.key === 'R') {
                        realtimeBtn.click();
                    } else if (e.key === 'f' || e.key === 'F') {
                        fastBtn.click();
                    }
                });
            }
            
            // Navigation and profile functionality initialized in app.js
        });
    </script>
    <!-- Clean UI initialization removed - handled in app.js -->
    <!-- SDA button click binding now handled in app.js -->
    <script>
        // Particle system for loading screen
        (function() {
            const canvas = document.getElementById('particle-canvas');
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Debris particles
            const particles = [];
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    size: Math.random() * 2 + 0.5,
                    brightness: Math.random()
                });
            }
            
            function animateParticles() {
                if (!document.getElementById('particle-canvas')) return;
                
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Update and draw particles
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    
                    // Wrap around edges
                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;
                    
                    // Draw particle
                    ctx.fillStyle = `rgba(255, 255, 255, ${p.brightness * 0.8})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });
                
                // Draw connections (proximity lines like login page)
                particles.forEach((p1, i) => {
                    particles.slice(i + 1).forEach(p2 => {
                        const dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
                        if (dist < 100) {
                            ctx.strokeStyle = `rgba(255, 0, 0, ${0.1 * (1 - dist / 100)})`;
                            ctx.lineWidth = 0.5;
                            ctx.beginPath();
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.stroke();
                        }
                    });
                });
                
                requestAnimationFrame(animateParticles);
            }
            
            animateParticles();
            
            // Remove particle canvas when app loads
            window.addEventListener('red-orbit-loaded', function() {
                setTimeout(() => {
                    const particleCanvas = document.getElementById('particle-canvas');
                    if (particleCanvas) {
                        particleCanvas.style.opacity = '0';
                        particleCanvas.style.transition = 'opacity 1s';
                        setTimeout(() => particleCanvas.remove(), 1000);
                    }
                }, 500);
            });
            
            // Handle resize
            window.addEventListener('resize', () => {
                if (canvas) {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                }
            });
        })();
    </script>
