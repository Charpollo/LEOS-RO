<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RED ORBIT - Access Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Particle Canvas Background */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            z-index: 10;
            position: relative;
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 42px;
            font-weight: bold;
            color: #ff0000;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            letter-spacing: 3px;
        }

        .logo .tagline {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
            letter-spacing: 2px;
        }

        /* Access Card */
        .access-card {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(255, 0, 0, 0.2);
            border-radius: 10px;
            padding: 40px 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .access-card h2 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 10px;
            text-align: center;
        }

        .access-card .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
            text-align: center;
        }

        /* Form */
        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: #aaa;
            font-size: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }

        .form-group input:focus {
            outline: none;
            border-color: rgba(255, 0, 0, 0.5);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
        }

        .form-group input::placeholder {
            color: #555;
            letter-spacing: 1px;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            border: none;
            border-radius: 5px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #ff3333 0%, #ff0000 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 0, 0, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Messages */
        .message {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .message.active {
            display: block;
        }

        .message.error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: #ff6666;
        }

        .message.success {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid rgba(0, 255, 0, 0.3);
            color: #66ff66;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Loading */
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .loading i {
            font-size: 32px;
            color: #ff0000;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Features */
        .features {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
        }

        .feature {
            text-align: center;
            color: #666;
            font-size: 12px;
        }

        .feature i {
            display: block;
            font-size: 20px;
            margin-bottom: 5px;
            color: #ff0000;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #666;
            font-size: 12px;
        }

        .footer a {
            color: #ff0000;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Info Box */
        .info-box {
            background: rgba(255, 100, 0, 0.1);
            border: 1px solid rgba(255, 100, 0, 0.3);
            border-radius: 5px;
            padding: 15px;
            margin-top: 20px;
            font-size: 13px;
            color: #ffa500;
            text-align: center;
        }

        .info-box i {
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <!-- Particle Canvas -->
    <canvas id="particle-canvas"></canvas>

    <!-- Main Container -->
    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <h1>RED ORBIT</h1>
            <div class="tagline">SPACE SITUATIONAL AWARENESS</div>
        </div>

        <!-- Access Card -->
        <div class="access-card">
            <h2>SECURE ACCESS</h2>
            <div class="subtitle">Enter passphrase to continue</div>

            <!-- Messages -->
            <div id="error-message" class="message error"></div>
            <div id="success-message" class="message success"></div>

            <!-- Passphrase Form -->
            <form id="passphrase-form">
                <div class="form-group">
                    <label for="passphrase">Access Passphrase</label>
                    <input 
                        type="password" 
                        id="passphrase" 
                        name="passphrase" 
                        placeholder="Enter passphrase"
                        autocomplete="off"
                        required
                    >
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-lock-open"></i>
                    <span>ACCESS RED ORBIT</span>
                </button>
            </form>

            <!-- Loading -->
            <div id="loading" class="loading">
                <i class="fas fa-spinner"></i>
            </div>

            <!-- Info Box -->
            <div class="info-box">
                <i class="fas fa-info-circle"></i>
                Beta Access Only. Contact <strong>mission@cyberrts.com</strong> for passphrase.
            </div>

            <!-- Features -->
            <div class="features">
                <div class="feature">
                    <i class="fas fa-satellite"></i>
                    <span>15,000+ Objects</span>
                </div>
                <div class="feature">
                    <i class="fas fa-atom"></i>
                    <span>Real Physics</span>
                </div>
                <div class="feature">
                    <i class="fas fa-shield-alt"></i>
                    <span>Secure Access</span>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>&copy; 2025 CyberRTS | <a href="https://cyberrts.com" target="_blank">cyberrts.com</a></p>
        </div>
    </div>

    <!-- Particle System Script -->
    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        for (let i = 0; i < 100; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5,
                size: Math.random() * 2 + 0.5
            });
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;

                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw connections
            particles.forEach((p1, i) => {
                particles.slice(i + 1).forEach(p2 => {
                    const dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
                    if (dist < 100) {
                        ctx.strokeStyle = `rgba(255, 0, 0, ${0.1 * (1 - dist / 100)})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                });
            });

            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>

    <!-- Passphrase Authentication -->
    <script type="module">
        import { passphraseAuth } from './js/auth/passphrase-auth.js';

        // Check if already authenticated
        if (passphraseAuth.isAuthenticated()) {
            window.location.replace('/');
        }

        const form = document.getElementById('passphrase-form');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');
        const loading = document.getElementById('loading');

        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.classList.add('active');
            successMessage.classList.remove('active');
        }

        function showSuccess(msg) {
            successMessage.textContent = msg;
            successMessage.classList.add('active');
            errorMessage.classList.remove('active');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const passphrase = document.getElementById('passphrase').value;
            
            loading.classList.add('active');
            
            // Small delay for effect
            await new Promise(resolve => setTimeout(resolve, 500));
            
            const result = passphraseAuth.authenticate(passphrase);
            
            if (result.success) {
                showSuccess('Access granted! Launching RED ORBIT...');
                setTimeout(() => {
                    window.location.replace('/');
                }, 1500);
            } else {
                showError(result.message);
                loading.classList.remove('active');
            }
        });
    </script>
</body>
</html>
